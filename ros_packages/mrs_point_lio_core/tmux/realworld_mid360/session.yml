# do not modify these
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
startup_window: simulator
pre_window: export UAV_NAME=uav1;
            export USE_SIM_TIME="false";
            export RMW_IMPLEMENTATION=rmw_zenoh_cpp
windows:
  - router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - livox:
      layout: tiled
      panes:
        - ros2 launch livox_ros_driver2 livox.launch.py
        # - ros2 launch livox_ros_driver2 livox.launch.py config:=./config/avia.json
  - point_lio:
      layout: tiled
      panes:
        - ros2 launch point_lio point_lio.launch.py preset:=mid360 topic_imu:=livox/imu topic_livox:=livox/custom custom_config:=./config/point_lio.yaml
  - mapping:
      layout: tiled
      panes:
        - ros2 launch mrs_octomap_server octomap.launch.py custom_config:=./config/octomap_server.yaml lidar_3d_0:=livox/points lidar_3d_0_free:=livox/invalid_points world_frame:=$UAV_NAME/point_lio_origin
  - record:
      layout: tiled
      panes:
        - mkdir -p ~/bag_files/latest; ./record.sh
  - tf:
      layout: tiled
      panes:
        - ./config/livox_tf.sh
        - ./config/world_origin_tf.sh
  - rviz:
      layout: tiled
      panes:
        - ros2 run rviz2 rviz2 -d ./rviz.rviz --ros-args -p use_sim_time:=$USE_SIM_TIME
